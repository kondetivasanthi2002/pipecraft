[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecraft-engine"
version = "2.5.0"
description = "Enterprise Scalable Data Pipeline & Workflow Engine"
readme = "README.md"
authors = [{ name = "Antigravity Data Team", email = "engineer@antigravity.ai" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "asyncio>=3.4.3",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "prometheus-client>=0.17.0",
    "httpx>=0.24.0"
]

[project.scripts]
pipecraft = "api.cli:main"
